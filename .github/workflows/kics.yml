# KICS (Keeping Infrastructure as Code Secure) – whole repo IaC scan.
# Run alongside Trivy (trivy.yml) to compare findings.
# Scans: Kubernetes, Helm, Dockerfile, etc.
#
# ADVANCED_SECURITY (same as trivy.yml): when "true", upload SARIF + artifacts.
#
name: KICS IaC Scan

permissions:
  contents: read
  security-events: write
  actions: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ADVANCED_SECURITY: "false"

jobs:
  kics:
    name: kics-iac
    if: vars.CI_G_KICS_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create results dir
        run: mkdir -p results-dir

      - name: Run KICS
        uses: synkube/actions/.github/actions/kics-github-action@9f425ac79ec75ce388b4e27528784a095a272584 # v1.0.0
        with:
          path: .
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: results-dir/
          output_formats: json,sarif
          ignore_on_exit: results

      - name: Upload KICS SARIF
        if: env.ADVANCED_SECURITY == 'true'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        continue-on-error: true
        with:
          sarif_file: "results-dir/results.sarif"
          category: "kics-iac"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload KICS results as artifacts
        if: env.ADVANCED_SECURITY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kics-results
          path: results-dir/
