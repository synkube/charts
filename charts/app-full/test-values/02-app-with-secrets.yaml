# Test 2: Application with Secrets (app-starter + app-extensions)
# Demonstrates: ExternalSecrets, ConfigMaps, Roles

app-starter:
  image:
    repository: myorg/api-server
    tag: v2.1.0

  replicaCount: 3

  container:
    ports:
      - name: http
        containerPort: 8080
      - name: metrics
        containerPort: 9090

    envMap:
      LOG_LEVEL: info
      ENVIRONMENT: production

    # Reference secrets created by app-extensions
    envFromSecretName: api-secrets

    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 1Gi

  service:
    ports:
      - port: 80
        targetPort: 8080
        name: http
      - port: 9090
        targetPort: 9090
        name: metrics

  ingress:
    enabled: true
    className: traefik
    hosts:
      - host: api.example.com
        paths: ["/"]
    tls:
      - hosts: [api.example.com]
        secretName: api-tls

  serviceAccount:
    create: true
    name: api-service

# Enable app-extensions for secrets and RBAC
app-extensions:
  enabled: true

  # External secrets from Vault
  externalSecrets:
    api-secrets:
      refreshInterval: "1h"
      secretStoreRef:
        name: vault-backend
        kind: ClusterSecretStore
      target:
        name: api-secrets
        creationPolicy: Owner
      data:
        - secretKey: DATABASE_URL
          remoteRef:
            key: api/database
            property: connection_string
        - secretKey: REDIS_URL
          remoteRef:
            key: api/cache
            property: url
        - secretKey: API_KEY
          remoteRef:
            key: api/keys
            property: secret_key

  # Application configuration
  configMaps:
    api-config:
      annotations:
        reloader.stakater.com/match: "true"
      data:
        config.yaml:
          content: |
            server:
              port: 8080
              timeout: 30s
            database:
              pool_size: 10
              max_idle: 5
            cache:
              ttl: 300
              prefix: api

  # Namespace-scoped RBAC
  roles:
    api-reader:
      rules:
        - apiGroups: [""]
          resources: ["secrets", "configmaps"]
          verbs: ["get", "list", "watch"]

  roleBindings:
    api-reader-binding:
      subjects:
        - kind: ServiceAccount
          name: api-service
      roleRef:
        kind: Role
        name: api-reader

# platform-extensions disabled
