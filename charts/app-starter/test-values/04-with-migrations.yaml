# Test 4: Application with database migrations
replicaCount: 2

image:
  repository: myapp/api
  tag: "v1.5.0"
  pullPolicy: Always

container:
  ports:
    - name: http
      containerPort: 3000
      protocol: TCP

service:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      name: http

env:
  - name: NODE_ENV
    value: production
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: connection-string

secrets:
  API_KEY: c3VwZXJzZWNyZXQ=
  JWT_SECRET: YW5vdGhlcnNlY3JldA==

migrations:
  enabled: true
  backoffLimit: 3
  workDir: /app
  commands:
    - npm run db:migrate
    - npm run db:seed
  restartPolicy: OnFailure

configMaps:
  app-config.yaml:
    mountPath: /app/config/app-config.yaml
    content: |-
      server:
        port: 3000
        host: 0.0.0.0
      logging:
        level: info

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5

