# Test case: Advanced Deployment configuration
# Tests: nameOverride, deployment strategy, lifecycle hooks, command/args

nameOverride: "custom-app"

deployment:
  enabled: true
  annotations:
    deployment.kubernetes.io/revision: "1"
    example.com/deployment-id: "abc123"

  # Custom deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2

replicaCount: 3

revisionHistoryLimit: 10

terminationGracePeriodSeconds: 60

image:
  repository: nginx
  tag: "1.25"

container:
  # Custom container name
  name: web-server

  ports:
    - name: http
      containerPort: 8080

  # Override command and args
  command: ["/bin/sh"]
  args:
    - "-c"
    - |
      echo "Starting application...";
      nginx -g 'daemon off;'

  # Lifecycle hooks
  lifecycle:
    postStart:
      exec:
        command: ["/bin/sh", "-c", "echo 'Container started' > /tmp/started"]
    preStop:
      exec:
        command: ["/bin/sh", "-c", "sleep 15"]

  env:
    - name: APP_NAME
      value: "advanced-app"
    - name: LOG_LEVEL
      value: "debug"

  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5

  startupProbe:
    httpGet:
      path: /startup
      port: http
    initialDelaySeconds: 0
    failureThreshold: 30
    periodSeconds: 5

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Pod annotations and labels
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  example.com/version: "1.0.0"

podLabels:
  app-tier: "frontend"
  environment: "production"
  team: "platform"

service:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http

