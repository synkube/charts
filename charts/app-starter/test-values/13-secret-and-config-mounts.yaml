# Test case: Secrets and ConfigMaps as file mounts
# Tests: secretMounts, configMaps file mounting, custom volumes

deployment:
  enabled: true

image:
  repository: nginx
  tag: "1.25"

container:
  ports:
    - name: http
      containerPort: 80
    - name: https
      containerPort: 443

  env:
    - name: CONFIG_DIR
      value: "/config"
    - name: CERTS_DIR
      value: "/certs"

  # Custom volumes for shared cache
  volumes:
    - name: cache
      emptyDir:
        sizeLimit: 1Gi
    - name: tmp
      emptyDir: {}

  volumeMounts:
    - name: cache
      mountPath: /var/cache/nginx
    - name: tmp
      mountPath: /tmp

  resources:
    limits:
      cpu: 500m
      memory: 512Mi

# ConfigMaps mounted as files
configMaps:
  nginx.conf:
    mountPath: /config/nginx.conf
    content: |
      server {
        listen 80;
        server_name localhost;
        location / {
          root /usr/share/nginx/html;
          index index.html;
        }
      }

  app-config.json:
    mountPath: /config/app.json
    content: |
      {
        "environment": "production",
        "debug": false,
        "features": {
          "newUI": true,
          "analytics": true
        }
      }

# Secrets stored in chart
secrets:
  TLS_CERT: "LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUN..."
  TLS_KEY: "LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCk1JSUV..."
  API_KEY: "secret-api-key-12345"

# Mount secrets as files
secretMounts:
  tls-cert:
    secretKey: TLS_CERT
    mountPath: /certs/tls/
    fileName: tls.crt
  tls-key:
    secretKey: TLS_KEY
    mountPath: /certs/keys/
    fileName: tls.key

# Also load API_KEY as env var
envFromSecrets: [test-app-starter]

service:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
    - port: 443
      targetPort: 443
      name: https

