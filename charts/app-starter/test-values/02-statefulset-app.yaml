# Test 2: StatefulSet application with persistence
deployment:
  enabled: false

statefulSet:
  enabled: true

replicaCount: 3

image:
  repository: postgres
  tag: "15-alpine"
  pullPolicy: IfNotPresent

container:
  name: postgres
  ports:
    - name: postgres
      containerPort: 5432
      protocol: TCP
  env:
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: password
    - name: POSTGRES_DB
      value: mydb
  initContainers:
    - name: init-permissions
      image: busybox:latest
      command: ['sh', '-c', 'chown -R 999:999 /var/lib/postgresql/data']
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data

service:
  type: ClusterIP
  headless: true
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres

persistence:
  enabled: true
  size: 10Gi
  storageClass: standard
  volumeName: data
  mountPath: /var/lib/postgresql/data
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 2

