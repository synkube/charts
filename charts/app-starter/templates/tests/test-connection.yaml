{{- if and .Values.test.enabled -}}
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "app-starter.fullname" . }}-test-connection"
  labels:
{{ include "app-starter.labels" . | indent 4 }}
  annotations:
    "helm.sh/hook": test-success
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args:  ['{{ include "app-starter.fullname" . }}:{{ (index .Values.service.ports 0).port }}']
  restartPolicy: Never
{{- end -}}
