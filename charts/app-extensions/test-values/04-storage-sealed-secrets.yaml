# Test 4: Storage and Sealed Secrets
# Demonstrates: PVCs, SealedSecrets with different configurations

# Persistent Volume Claims for application storage
persistentVolumeClaims:
  myapp-data:
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: fast-ssd
    annotations:
      volume.beta.kubernetes.io/storage-class: fast-ssd

  myapp-shared-cache:
    accessModes:
      - ReadWriteMany
    size: 5Gi
    storageClassName: nfs-client
    selector:
      matchLabels:
        app: myapp
        tier: cache

  myapp-backup:
    accessModes:
      - ReadWriteOnce
    size: 50Gi
    storageClassName: standard-retain
    annotations:
      volume.kubernetes.io/selected-node: node-with-local-ssd

# Sealed Secrets (encrypted at rest)
sealedSecrets:
  myapp-production-secrets:
    annotations:
      sealedsecrets.bitnami.com/cluster-wide: "true"
    encryptedData:
      # These would be real encrypted values in practice
      database-password: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEQAx...
      api-key: AgAKAoiQm94A7/ZLdClVp5xSz7GQcK1Y8J...
      jwt-secret: AgCCOEf8+RmuQjPzm3qAHzGr4V8bH2n9dA...
    template:
      metadata:
        name: myapp-production-secrets
        labels:
          app: myapp
          environment: production
        annotations:
          replicator.v1.mittwald.de/replicate-to: "production-*"
      type: Opaque

  myapp-tls-sealed:
    encryptedData:
      tls.crt: AgBghNcAQ7M8AqV0Kq+G5T9lNhAa7xT8E...
      tls.key: AgA7YZcE0gA43PlbHVfx2m8qJ9rK4Y3mF...
    template:
      metadata:
        name: myapp-tls-certificate
        labels:
          app: myapp
          certificate: wildcard
      type: kubernetes.io/tls

# ConfigMap for storage configuration
configMaps:
  storage-config:
    data:
      backup-policy.yaml:
        content: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: backup-schedule
          data:
            schedule: "0 2 * * *"  # Daily at 2 AM
            retention: "30d"
            compression: "gzip"
            destinations:
              - s3://{{ .Release.Name }}-backups/database/
              - s3://{{ .Release.Name }}-backups/files/

      mount-config.json:
        content: |
          {
            "mounts": {
              "/data": {
                "pvc": "myapp-data",
                "subPath": "application"
              },
              "/cache": {
                "pvc": "myapp-shared-cache",
                "readOnly": false
              },
              "/backup": {
                "pvc": "myapp-backup",
                "subPath": "{{ .Release.Name }}"
              }
            }
          }

# Service Account with storage permissions
serviceAccounts:
  storage-manager:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/myapp-storage-role
    automountServiceAccountToken: true

# Role for storage management
roles:
  storage-manager:
    rules:
      - apiGroups: [""]
        resources: ["persistentvolumeclaims", "persistentvolumes"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["storage.k8s.io"]
        resources: ["storageclasses"]
        verbs: ["get", "list"]
      - apiGroups: ["snapshot.storage.k8s.io"]
        resources: ["volumesnapshots", "volumesnapshotcontents"]
        verbs: ["get", "list", "create"]

# Role binding for storage
roleBindings:
  storage-manager:
    subjects:
      - kind: ServiceAccount
        name: storage-manager
    roleRef:
      kind: Role
      name: storage-manager
