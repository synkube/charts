# Test 2: External Secrets with namespace SecretStore
# Demonstrates: ExternalSecret, SecretStore integration

# Namespace-scoped SecretStore (references ClusterSecretStore created by platform team)
secretStores:
  vault-backend:
    annotations:
      external-secrets.io/backend: vault
    provider:
      vault:
        server: "https://vault.company.com"
        path: "secret"
        version: "v2"
        auth:
          kubernetes:
            mountPath: "kubernetes"
            role: "myapp-role"
            serviceAccountRef:
              name: myapp-sa

# External Secrets syncing from multiple sources
externalSecrets:
  myapp-database-creds:
    refreshInterval: "30m"
    secretStoreRef:
      name: vault-backend
      kind: SecretStore
    target:
      name: myapp-db-secret
      creationPolicy: Owner
      template:
        type: Opaque
        metadata:
          labels:
            app: myapp
            component: database
        data:
          # Template the database URL from multiple secret keys
          database-url: "postgresql://{{ .username }}:{{ .password }}@{{ .Release.Name }}-db:5432/{{ .database }}"
    data:
      - secretKey: username
        remoteRef:
          key: myapp/database
          property: username
      - secretKey: password
        remoteRef:
          key: myapp/database
          property: password
      - secretKey: database
        remoteRef:
          key: myapp/database
          property: name

  myapp-api-keys:
    refreshInterval: "1h"
    secretStoreRef:
      name: infisical-platform  # References ClusterSecretStore
      kind: ClusterSecretStore
    target:
      name: myapp-api-secret
      creationPolicy: Owner
    dataFrom:
      - extract:
          key: myapp/api-keys

  myapp-ssl-certs:
    refreshInterval: "24h"
    secretStoreRef:
      name: vault-backend
      kind: SecretStore
    target:
      name: myapp-tls-secret
      creationPolicy: Owner
      template:
        type: kubernetes.io/tls
        metadata:
          annotations:
            cert-manager.io/issuer: external-vault
    data:
      - secretKey: tls.crt
        remoteRef:
          key: myapp/ssl
          property: certificate
      - secretKey: tls.key
        remoteRef:
          key: myapp/ssl
          property: private_key

# Service Account for external secret access
serviceAccounts:
  myapp-sa:
    annotations:
      vault.hashicorp.com/agent-inject: "true"
      vault.hashicorp.com/role: "myapp-role"
    automountServiceAccountToken: true
