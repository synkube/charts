# Test 1: Simple secrets and ConfigMaps
# Demonstrates: basic Secret, ConfigMap creation with templating support

# Regular Secrets with templating
secrets:
  myapp-database:
    type: Opaque
    annotations:
      replicator.v1.mittwald.de/replicate-to: "*"
    data:
      username: "myuser"
      password: "{{ .Release.Name }}-secret-password"
      database: "{{ .Release.Name }}_db"

  myapp-api:
    type: Opaque
    stringData:
      config.yaml: |
        host: "{{ .Release.Name }}-api"
        port: 8080
        database_url: "postgresql://user:pass@{{ .Release.Name }}-db:5432/myapp"

# ConfigMaps with templating
configMaps:
  myapp-config:
    annotations:
      reloader.stakater.com/match: "true"
    data:
      app.yaml:
        content: |
          environment: production
          app_name: {{ .Release.Name }}
          namespace: {{ .Release.Namespace }}
          chart: {{ .Chart.Name }}
          version: {{ .Chart.Version }}

      nginx.conf:
        content: |
          server {
            listen 80;
            server_name {{ .Release.Name }}.example.com;
            location / {
              proxy_pass http://{{ .Release.Name }}-backend:8080;
              proxy_set_header Host $host;
            }
          }

      metadata.json:
        content: |
          {
            "release": "{{ .Release.Name }}",
            "namespace": "{{ .Release.Namespace }}",
            "timestamp": "{{ now | date "2006-01-02T15:04:05Z07:00" }}"
          }
